[package]
name = "bunkobank-desktop"
version = "2.0.3"
description = "Bunkobank local server manager"
authors = ["Bunkobank contributors"]
edition = "2021"
rust-version = "1.77.2"
default-run = "bunkobank-desktop"

[lib]
name = "bunkobank_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
